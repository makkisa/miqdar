name: Deploy free Gemini Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/domain.ts"
      - ".github/workflows/worker.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: miqdar-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Worker bundle
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/miqdar-worker --config worker/wrangler.toml
      - name: Ensure workers.dev subdomain
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GEMINI_API_KEY != '' }}
        uses: actions/github-script@v7
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const api = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}/workers/subdomain`;
            let response = await fetch(api, {
              headers: { Authorization: `Bearer ${process.env.CF_TOKEN}` }
            });
            if (response.status === 404) {
              response = await fetch(api, {
                method: 'PUT',
                headers: { Authorization: `Bearer ${process.env.CF_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ subdomain: 'miqdar-de610' })
              });
            }
            if (!response.ok) throw new Error(`Unable to register workers.dev subdomain (${response.status})`);
            core.info('workers.dev subdomain is ready.');
      - name: Publish Worker and transfer Gemini secret
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GEMINI_API_KEY != '' }}
        shell: bash
        run: |
          set +x
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4.157.0 secret put GEMINI_API_KEY --config worker/wrangler.toml
          npx --yes wrangler@4.157.0 deploy --config worker/wrangler.toml
